spring.application.name=shopstack-backend
server.port=${PORT:8080}

# Postgres — override via env vars in any real environment, do not commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopstack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# Default admin bootstrap account — see AdminBootstrapSeeder. Change in production via env vars.
shopstack.admin.default-email=${ADMIN_EMAIL}
shopstack.admin.default-password=${ADMIN_PASSWORD}

# Razorpay Test Gateway Keys
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TECaA3sKWcStkX}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:hLTeW7WtqvQljj9sZ05pZEXZ}

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:ReplaceThisWithA256BitSecretKeyForDevelopmentOnly123456789}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration & Frontend Redirect URL
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

#spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Cloudinary configuration (set via env vars in production)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:YOUR_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:YOUR_API_SECRET}
